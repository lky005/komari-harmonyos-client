# 无签名 release .app 构建流水线
# 产物: default product + release 构建模式（与本地 release product 口径等价，未签名）
# 产物只留在 Actions artifact（不自动发 Release）；需要发布时人工建 Release 并上传
# 工具链升级: 换 CLT_URL 变量值 + 更新下方 cache key 与体积校验值
name: build-unsigned-app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache commandline-tools
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/commandline-tools
          key: clt-linux-x64-26.0.0.821-v2

      - name: Download commandline-tools
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CLT_URL: ${{ vars.CLT_URL }}
        run: |
          set -e
          if [ -z "$CLT_URL" ]; then
            echo "::error::缺少仓库变量 CLT_URL（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
          echo "开始下载 Command Line Tools（约 2239 MB），每 20s 打点一次"
          TOTAL=2347882285
          curl -sL --retry 3 --retry-delay 2 \
               --speed-time 60 --speed-limit 10240 \
               --max-time 2400 \
               -o /tmp/clt.zip "$CLT_URL" &
          curl_pid=$!
          last=0; last_t=$(date +%s)
          while kill -0 "$curl_pid" 2>/dev/null; do
            sleep 20
            now=$(date +%s)
            size=$(stat -c%s /tmp/clt.zip 2>/dev/null || echo 0)
            elapsed=$(( now - last_t )); [ "$elapsed" -gt 0 ] || elapsed=1
            speed=$(( (size - last) / elapsed / 1024 ))
            pct=$(( size * 100 / TOTAL ))
            echo "[$(date -u +%H:%M:%S)] 已下载 $((size/1024/1024)) MB / $((TOTAL/1024/1024)) MB (${pct}%) | 速率 ${speed} KB/s"
            last=$size; last_t=$now
          done
          rc=0
          wait "$curl_pid" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::curl 退出码 $rc（28=超时或网速停滞被中止），CLT_URL 可能失效或跨网过慢"
            exit 1
          fi
          actual=$(stat -c%s /tmp/clt.zip)
          echo "downloaded: $actual bytes"
          if [ "$actual" -lt 2000000000 ]; then
            echo "::error::下载体积异常（预期约 2.19GB，实际 $actual 字节），CLT_URL 可能已失效"
            exit 1
          fi
          mkdir -p /tmp/clt-unpack /opt
          unzip -q /tmp/clt.zip -d /tmp/clt-unpack
          rm -f /tmp/clt.zip
          echo "zip 顶层结构："
          find /tmp/clt-unpack -mindepth 1 -maxdepth 1 | head -10
          shopt -s nullglob dotglob
          dirs=(/tmp/clt-unpack/*)
          if [ ${#dirs[@]} -eq 1 ] && [ -d "${dirs[0]}" ]; then
            mv "${dirs[0]}" /opt/commandline-tools
          else
            mv /tmp/clt-unpack /opt/commandline-tools
          fi
          if [ ! -d /opt/commandline-tools/bin ]; then
            inner_bin=$(find /opt/commandline-tools -maxdepth 2 -type d -name bin | head -1)
            if [ -n "$inner_bin" ]; then
              root=$(dirname "$inner_bin")
              echo "检测到嵌套目录 $root，上提一层"
              mv "$root"/* /opt/commandline-tools/
              rmdir "$root"
            fi
          fi
          [ -d /opt/commandline-tools/bin ] || { echo "::error::解压后未找到 bin 目录，实际结构："; find /opt/commandline-tools -maxdepth 2 | head -20; exit 1; }
          chmod -R u+x /opt/commandline-tools/bin

      - name: Add CLI tools to PATH
        run: |
          echo "/opt/commandline-tools/bin" >> "$GITHUB_PATH"
          node_bin=$(find /opt/commandline-tools -maxdepth 3 -type d -path '*node*/bin' 2>/dev/null | head -1)
          if [ -n "$node_bin" ]; then
            echo "$node_bin" >> "$GITHUB_PATH"
          fi

      - name: Verify tools
        run: |
          ohpm -v
          hvigorw -v

      - name: ohpm install
        run: ohpm install --all

      - name: Build unsigned release .app
        run: hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-sign

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -name '*.app' -not -path './oh_modules/*' -not -path './dist/*' -exec cp {} dist/ \;
          ls -lh dist/
          if [ -z "$(ls -A dist/)" ]; then
            echo "::error::构建未产出 .app"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ github.ref_name }}
          path: dist/
